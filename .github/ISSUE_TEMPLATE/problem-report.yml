name: Problem report
description: Report a problem with Cader. Press ! in Cader to open this form with its diagnostics filled in.
labels: ["bug", "from-cader"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. The diagnostics below hold no names, paths or code: only versions, the kinds of what Cader did, failures without their messages, and counts of the programs it ran. Read them, and delete anything you would rather not share before you submit.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did and what Cader did. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: The keys you pressed, if you can repeat it.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics from Cader
      description: Filled in by Cader's ! key. Leave it empty if you opened this form yourself.
      render: text
