name: Build, test and pack
description: >-
  Builds the solution in Release (warnings are errors) with the .NET SDK global.json names, runs every test
  project against that build (unless run-tests is false), checks whitespace formatting, then publishes the self-contained winget
  build for the runtime identifier and zips it. Run by pipeline.yml's check job, whose zip on a release is the one the release job
  publishes, so the release never ships a build that the check did not see.

inputs:
  runtime-identifier:
    description: >-
      The winget build to publish and zip, win-x64 or win-arm64. The runner must be of that architecture, so the
      smoke check can run the zip.
    required: false
    default: win-x64
  run-tests:
    description: >-
      true runs the tests and the whitespace check. The tests do not depend on the architecture, so pipeline.yml runs
      them on the win-x64 leg only.
    required: false
    default: 'true'
  version-suffix:
    description: >-
      Prerelease suffix added to the csproj Version in the zip's name, e.g. ci.42. Empty names it with
      the plain version. Every run but a release passes one so its zip is told apart from a release's.
    required: false
    default: ''

outputs:
  version:
    description: The version the zip is named for (csproj Version plus any suffix).
    value: ${{ steps.zip.outputs.version }}
  zip:
    description: Path of the winget build's zip, cader_<version>_<runtime identifier>.zip, written to artifacts/winget.
    value: ${{ steps.zip.outputs.zip }}

runs:
  using: composite
  steps:
    # global.json (11.0.100, latestMinor) names the SDK. The windows-latest image of 14 November 2026
    # (windows-2025-vs2026 20261103.298.1) carries SDKs up to 10.0.403 and no 11.0, so the SDK global.json names is
    # installed from global.json itself, rollForward included (https://github.com/actions/setup-dotnet#using-the-global-json-file-input).
    # The step can go once both runner images carry an 11.0 SDK.
    - name: Install the .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    # The line records which SDK built this run (https://learn.microsoft.com/dotnet/core/tools/global-json).
    - name: Show the .NET SDK
      shell: pwsh
      run: dotnet --version

    - name: Build (Release, warnings are errors)
      shell: pwsh
      run: dotnet build -c Release

    - name: Test
      if: inputs.run-tests == 'true'
      shell: pwsh
      run: dotnet test -c Release --no-build

    # The build's own scripts (the zip, install-local), under test\Scripts, with the Pester the runner image carries.
    - name: Script tests
      if: inputs.run-tests == 'true'
      shell: pwsh
      run: Invoke-Pester -Path test\Scripts -CI

    # Whitespace only: EnforceCodeStyleInBuild and TreatWarningsAsErrors in Directory.Build.props already fail
    # the build on every style and analyser rule at warning, which is what dotnet format's style and analyzers
    # passes check. Folder mode reads the same .editorconfig without loading an MSBuild workspace (about 2 s
    # against 16 s on the runner) and skips the SDK's generated files under obj unless --include-generated is
    # given. openspec is left out: its archive holds sample .cs files that are not part of the solution.
    # (https://learn.microsoft.com/dotnet/core/tools/dotnet-format)
    - name: Format (whitespace)
      if: inputs.run-tests == 'true'
      shell: pwsh
      run: dotnet format whitespace --folder --verify-no-changes --exclude openspec

    # The self-contained single-file build winget installs (src\Source191.Cader\README.md, The winget build). It builds
    # the program again for win-x64, so warnings are still errors; the assembly keeps the csproj Version.
    - name: Publish the winget build
      shell: pwsh
      env:
        RUNTIME_IDENTIFIER: ${{ inputs.runtime-identifier }}
      run: |
        $ErrorActionPreference = 'Stop'
        if (Test-Path artifacts\publish) { Remove-Item -Recurse -Force artifacts\publish }
        dotnet publish src\Source191.Cader "-p:PublishProfile=$env:RUNTIME_IDENTIFIER"
        exit $LASTEXITCODE

    - name: Zip the winget build
      id: zip
      shell: pwsh
      env:
        VERSION_SUFFIX: ${{ inputs.version-suffix }}
        RUNTIME_IDENTIFIER: ${{ inputs.runtime-identifier }}
      run: |
        $ErrorActionPreference = 'Stop'
        $version = (Select-Xml -Path src\Source191.Cader\Source191.Cader.csproj -XPath '//Version').Node.InnerText
        if (-not [string]::IsNullOrEmpty($env:VERSION_SUFFIX)) {
            $version = "$version-$env:VERSION_SUFFIX"
        }
        $zip = .github/scripts/Compress-WingetBuild.ps1 -PublishFolder artifacts\publish -RuntimeIdentifier $env:RUNTIME_IDENTIFIER -Version $version -DestinationFolder artifacts\winget
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "version=$version" >> $env:GITHUB_OUTPUT
        "zip=$zip" >> $env:GITHUB_OUTPUT
