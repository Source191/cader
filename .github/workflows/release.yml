name: release

# Runs only on a push to main, never on a pull request: a release comes from a merge. It is a
# no-op unless this push changed Version in src/Source191.Vantage/Source191.Vantage.csproj, so
# bumping the version (already required because the tool cache keeps a version for ever) is the
# same action that decides whether a release happens. Every release carries the winget build's zip and,
# while nuget.org users are moved to winget, the nupkg. A stable release's zip is then submitted to the
# winget community repository (the winget job); a prerelease never is. Publishing to nuget.org is never
# done from here: publish.yml pushes a tested release's package by hand, for the one release that moves
# dotnet tool users to winget, and verifies its provenance attestation before it pushes.
on:
  push:
    branches: [main]

jobs:
  # Builds and tests with read rights only, so the version check, the restore and the tests never hold a token that
  # can write to the repository or sign anything. The package and the zip travel to the release job as an artefact.
  build:
    name: Build the package if the version changed
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Compares the pushed commit against its first parent, which for the merge and squash commits
      # this repository uses is the previous tip of main, so a whole pull request is in view.
      - name: Check whether Version changed in this push
        id: check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csproj = 'src/Source191.Vantage/Source191.Vantage.csproj'
          git diff --quiet HEAD^ HEAD -- $csproj
          $diff = $LASTEXITCODE
          if ($diff -eq 0) {
              "changed=false" >> $env:GITHUB_OUTPUT
              Write-Host "$csproj unchanged in this push: nothing to release."
              exit 0
          }
          if ($diff -ne 1) {
              throw "git diff failed with exit code $diff; refusing to guess whether Version changed."
          }
          # A regex rather than an [xml] cast: git's output comes through the console encoding, and a byte
          # order mark would break the cast.
          $before = [regex]::Match((git show "HEAD^:$csproj" | Out-String), '<Version>\s*([^<]+?)\s*</Version>').Groups[1].Value
          $after = (Select-Xml -Path $csproj -XPath '//Version').Node.InnerText
          if ([string]::IsNullOrWhiteSpace($before) -or [string]::IsNullOrWhiteSpace($after)) {
              throw "Could not read Version from $csproj (before='$before', after='$after')."
          }
          if ($before -eq $after) {
              "changed=false" >> $env:GITHUB_OUTPUT
              Write-Host "$csproj changed but Version did not ($before): nothing to release."
              exit 0
          }
          "changed=true" >> $env:GITHUB_OUTPUT
          "version=$after" >> $env:GITHUB_OUTPUT
          Write-Host "Version changed: $before -> $after"

      # check.yml runs on this same push but nothing makes the release wait for it, so the release
      # builds and tests for itself rather than trusting a run it cannot see.
      - uses: ./.github/actions/build-test-pack
        if: steps.check.outputs.changed == 'true'
        id: build

      # A stable release's notes start with its CHANGELOG.md section, written beside the package so the artefact stays
      # flat; a prerelease's file is empty and unused. The release job checks nothing out, so the notes travel with the package.
      - name: Write the release notes
        id: notes
        if: steps.check.outputs.changed == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.check.outputs.version }}
          PACKAGE: ${{ steps.build.outputs.package }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = Join-Path (Split-Path $env:PACKAGE) 'release-notes.md'
          .github/scripts/Write-ReleaseNotes.ps1 -Version $env:VERSION -Destination $notes
          "path=$notes" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.changed == 'true'
        with:
          name: package
          path: |
            ${{ steps.build.outputs.package }}
            ${{ steps.build.outputs.zip }}
            ${{ steps.notes.outputs.path }}
          if-no-files-found: error

  # Attests and publishes the package and the zip the build job made, and nothing else: it checks nothing out and runs
  # no build, so the write and signing rights are held only by steps that download, attest and call gh.
  release:
    name: Publish the release
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    # contents to publish the release; id-token and attestations to sign the package's provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      # upload-artifact keeps the files' paths below their common folder, so the zip may sit in a subfolder.
      - name: Find the package and the zip
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem package -Recurse -Filter *.nupkg)
          if ($packages.Count -ne 1) {
              throw "Expected exactly one .nupkg in the build's artefact, found $($packages.Count)."
          }
          $zips = @(Get-ChildItem package -Recurse -Filter 'vantage_*_win-x64.zip')
          if ($zips.Count -ne 1) {
              throw "Expected exactly one vantage_<version>_win-x64.zip in the build's artefact, found $($zips.Count)."
          }
          $notes = @(Get-ChildItem package -Recurse -Filter release-notes.md)
          "path=$($packages[0].FullName)" >> $env:GITHUB_OUTPUT
          "zip=$($zips[0].FullName)" >> $env:GITHUB_OUTPUT
          "notes=$(if ($notes.Count -eq 1) { $notes[0].FullName })" >> $env:GITHUB_OUTPUT

      # Signed build provenance for the package and the zip: which commit and workflow built them, kept by GitHub.
      # publish.yml checks the package's with gh attestation verify before it pushes anything to nuget.org, and anyone
      # can check the zip's before an install. The attestation is made on the downloaded bytes, which are the ones released.
      # (https://docs.github.com/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-to-establish-provenance-for-builds,
      # https://cli.github.com/manual/gh_attestation_verify)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.zip }}

      # gh is on the runner, so no third-party action is needed for the release itself. A version with a
      # prerelease label (0.16.2-preview.1; the csproj never carries build metadata) is published as a
      # GitHub prerelease, so it never becomes the repository's Latest release. Nothing is checked out, so the
      # repository is named. A stable release's notes are its CHANGELOG.md section, which gh puts before the generated
      # list (gh release create --help: notes given with the generated ones are prepended), and the list starts at the
      # previous stable release's tag, so it covers every preview since; a prerelease keeps the generated notes alone.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PACKAGE: ${{ steps.package.outputs.path }}
          ZIP: ${{ steps.package.outputs.zip }}
          NOTES: ${{ steps.package.outputs.notes }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @("v$env:VERSION", $env:PACKAGE, $env:ZIP, '--repo', $env:GITHUB_REPOSITORY, '--title', "v$env:VERSION", '--generate-notes', '--target', $env:GITHUB_SHA)
          if ($env:VERSION.Contains('-')) {
              $arguments += '--prerelease'
          }
          else {
              $arguments += '--notes-file', $env:NOTES
              $previous = gh release list --repo $env:GITHUB_REPOSITORY --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName'
              if ($LASTEXITCODE -ne 0) {
                  throw "gh release list failed with exit code $LASTEXITCODE."
              }
              if (-not [string]::IsNullOrWhiteSpace($previous)) {
                  $arguments += '--notes-start-tag', $previous.Trim()
              }
          }
          gh release create @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "gh release create failed with exit code $LASTEXITCODE."
          }

  # A stable release becomes installable with winget once a pull request adding its manifest to microsoft/winget-pkgs is
  # merged; the update check reads only merged manifests, so nobody is offered a version before winget can install it.
  # wingetcreate (Microsoft's manifest tool, pinned to a release and its SHA-256) downloads the release's zip, hashes it,
  # updates the manifest the owner first submitted by hand (MAINTAINING.md, winget) and opens the pull request from a
  # fork owned by WINGET_PKGS_TOKEN's account: a classic personal access token with the public_repo scope, the only
  # secret here. A prerelease is never submitted. With no token, or when the pull request cannot be opened, the job
  # fails, so a release that winget never hears of is seen at once; rerun the job once the cause is fixed.
  # (https://github.com/microsoft/winget-create/blob/v1.12.13.0/doc/update.md)
  winget:
    name: Submit the release to winget
    needs: [build, release]
    if: needs.build.outputs.changed == 'true' && !contains(needs.build.outputs.version, '-')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Submit the manifest to the winget community repository
        shell: pwsh
        env:
          WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrEmpty($env:WINGET_PKGS_TOKEN)) {
              Write-Host '::error::WINGET_PKGS_TOKEN is not set, so this release was not submitted to winget. Add it (MAINTAINING.md, winget) and rerun this job.'
              exit 1
          }

          $tool = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe' -OutFile $tool
          $hash = (Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash
          if ($hash -ne '24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA') {
              throw "wingetcreate.exe has SHA-256 $hash, not the pinned release's."
          }

          $zip = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:VERSION/vantage_$($env:VERSION)_win-x64.zip"
          & $tool update Source191.Vantage --version $env:VERSION --urls "$zip|x64" --submit --token $env:WINGET_PKGS_TOKEN
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::wingetcreate update failed with exit code $LASTEXITCODE, so v$env:VERSION is not on its way to winget. Read its output above, fix the cause and rerun this job."
              exit 1
          }
