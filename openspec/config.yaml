schema: spec-driven

context: |
  Cader is a terminal console for Claude Code sessions and git worktrees on Windows 11, installed with winget as the self-contained program `cader`.
  Windows only: Windows Terminal (wt.exe, 1.25 or later), PowerShell 7, the Claude Code CLI 2.1.309 or later, git. No macOS or Linux support in this version.
  Sessions it starts are background sessions under Claude Code's supervisor (claude --bg -n <name>). It shells out to claude attach rather than hosting a session itself.
  Depend only on the documented CLI surface: claude agents --json [--all], claude --bg, claude attach, claude stop, claude rm, claude --bg --resume, claude auth status --json. Never read the files in the ~/.claude/sessions or ~/.claude/jobs folders (watching those two folders for change notifications, which reports only names, is allowed), and never parse transcript JSONL beyond checking that a transcript file exists, reading each transcript line's top-level type until a user or assistant line is found, and reading the organizationUuid of the first line whose type is session-owner. Resolve names to IDs before stop or rm, because those take only IDs.
  New worktrees go to <worktree root>\<repository>-<slug> on a branch named <slug>, never under .claude/worktrees; the worktree root is a setting (default worktrees beside the first repository root). Sibling worktrees made by versions before 0.8.0 stay where they are and are still listed and removed. It creates and removes them itself with git worktree commands.
  A new worktree is the wizard's default launch mode; the current branch is the alternative, and the only mode for a fixed folder (n on the worktrees view) and cader here.
  Windows Terminal can open a tab (title, tabColor, startingDirectory, suppressApplicationTitle); its command line can only focus a tab by index and cannot list tabs, but Windows UI Automation can select a tab item by its title in the owning WindowsTerminal.exe window, which is how the console switches to a tab it opened. A tab can set its own title (OSC 2) and tab background (OSC 4 palette entry 264) with escape sequences unless it was launched with an explicit tabColor. A tab closes by itself when its root shell exits with code 0.
  Never delete a worktree that has uncommitted changes, unpushed commits, a lock, or a live session inside it without an explicit force confirmation.
  Attention is the terminal bell: Claude Code's preferredNotifChannel terminal_bell for attached tabs, Cader's own bell when a background row starts waiting. There are no toasts and no hooks.
  Technology: C# on .NET 11, warnings are errors, test-driven. CLAUDE.md holds the layering, projects, coding and testing rules, and .claude\rules the verified facts (Claude Code CLI, Terminal.Gui, Windows Terminal, Windows, winget) and the security rules; keep artifacts consistent with them.

rules:
  proposal:
    - State what is out of scope, including multiple Claude accounts beyond naming a session's owner, which is a later change
  tasks:
    - Each task is one red-green-refactor cycle or smaller, with the test named before the code
    - Order tasks so the pure domain rules come before adapters and adapters before screens
    - A task that adds a key or an effect names its handler (the IEffectHandler class and its test) after the adapters it uses and before the screen or dialog that raises it
